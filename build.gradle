plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    springBootVersion = "3.4.5"
    springCloudVersion = "2024.0.1"
    springModulithVersion = "1.3.5"
}

def loadLocalEnv = {
    def envFile = rootProject.file('.env')
    if (!envFile.exists()) {
        return [:]
    }

    envFile.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') && it.contains('=') }
            .collectEntries { line ->
                def idx = line.indexOf('=')
                def key = line.substring(0, idx).trim()
                def value = line.substring(idx + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                key ? [(key): value] : [:]
            }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        // Spring MVC resolves @PathVariable/@RequestParam names from bytecode parameter names.
        // The Spring Boot Gradle plugin adds this automatically, but library modules (e.g. :alert)
        // that drop the boot plugin would otherwise lose parameter names and fail param binding.
        options.compilerArgs.add("-parameters")
    }

    // ✅ 핵심: BOM import를 서브프로젝트에 적용
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        }
        dependencies {
            dependency 'org.apache.commons:commons-lang3:3.20.0'
            dependency 'org.bouncycastle:bcprov-jdk18on:1.84'
            dependency 'org.bouncycastle:bcpkix-jdk18on:1.84'
            dependency 'org.eclipse.jetty:jetty-http:12.0.33'
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.named('test', Test).configure {
        finalizedBy 'jacocoTestReport'
        useJUnitPlatform {
            excludeTags 'docker'
        }
    }

    tasks.named('jacocoTestReport').configure {
        mustRunAfter tasks.named('test')
        reports {
            xml.required = true
            html.required = true
        }
        classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
            exclude '**/dto/**',
                    '**/config/**',
                    '**/*Application*',
                    '**/messaging/config/**',
                    '**/*Properties*',
                    '**/*Configuration*'
        })
    }

    tasks.register('dockerTest', Test) {
        description = 'Runs Docker/Testcontainers-backed tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        shouldRunAfter tasks.named('test')
        useJUnitPlatform {
            includeTags 'docker'
        }
    }

    plugins.withId('org.springframework.boot') {
        tasks.matching { it.name == 'bootRun' }.configureEach {
            environment loadLocalEnv()
            environment 'SPRING_DOCKER_COMPOSE_ENABLED', 'false'
        }
    }
}

configure([
        project(':api'),
        project(':market_data'),
        project(':meta_data'),
        project(':analytics'),
        project(':fx_ingestion'),
        project(':upbit_ingestion'),
        project(':binance_ingestion'),
        project(':fred'),
        project(':crawling')
]) {
    dependencies {
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }
}

apply from: "${rootDir}/gradle/portfolio-stats.gradle"
