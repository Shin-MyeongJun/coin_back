server:
  port: ${ALERT_PORT:8090}

spring:
  application:
    name: alert
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coindata}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  env: ${APP_ENV:dev}
  alert:
    default-channels: SSE
