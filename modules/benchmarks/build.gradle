plugins {
    id 'java-library'
    id 'me.champeau.jmh' version '0.7.2'
}

dependencies {
    implementation project(':contracts')
    implementation project(':infra_shard')
    implementation project(':infra_upbit')
    implementation project(':infra_binance')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.jsoniter:jsoniter:0.9.23'
    implementation 'com.dslplatform:dsl-json:2.0.2'
    implementation 'com.squareup.okio:okio:3.16.4'

    testImplementation 'org.junit.jupiter:junit-jupiter'

    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    jmhAnnotationProcessor 'com.dslplatform:dsl-json:2.0.2'
    testAnnotationProcessor 'com.dslplatform:dsl-json:2.0.2'
}

jmh {
    def quickRun = (project.findProperty('jmh.quick') ?: 'false').toString().toBoolean()
    warmupIterations = (project.findProperty('jmh.warmupIterations') ?: (quickRun ? 3 : 5)) as Integer
    iterations = (project.findProperty('jmh.iterations') ?: (quickRun ? 1 : 5)) as Integer
    fork = (project.findProperty('jmh.fork') ?: (quickRun ? 1 : 2)) as Integer
    warmup = project.findProperty('jmh.warmup') ?: (quickRun ? '100ms' : '1s')
    timeOnIteration = project.findProperty('jmh.timeOnIteration') ?: (quickRun ? '100ms' : '1s')
    timeUnit = 'us'
    benchmarkMode = ['thrpt', 'avgt']
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    profilers = ['gc']
}

tasks.register('jmhSummary') {
    description = 'Creates docs/portfolio/json-parser-benchmark.md from JMH JSON results.'
    group = 'reporting'
    mustRunAfter tasks.named('jmh')

    inputs.file(layout.buildDirectory.file('reports/jmh/results.json'))
    outputs.file(rootProject.layout.projectDirectory.file('docs/portfolio/json-parser-benchmark.md'))

    doLast {
        def resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
        if (!resultsFile.exists()) {
            throw new GradleException("JMH results not found: ${resultsFile}. Run .\\gradlew.bat :benchmarks:jmh first.")
        }

        def rows = new groovy.json.JsonSlurper().parse(resultsFile)
        if (rows.isEmpty()) {
            throw new GradleException("JMH results are empty: ${resultsFile}.")
        }
        def parserLabels = [
                JACKSON : 'Jackson',
                JSONITER: 'Jsoniter',
                DSL_JSON: 'DSL-JSON'
        ]
        def modeLabels = [
                thrpt: 'throughput',
                avgt : 'average time'
        ]

        def parsedRows = rows.collect { row ->
            def benchmarkName = row.benchmark.tokenize('.').last()
            def parserName = row.params?.parser ?: 'UNKNOWN'
            def primary = row.primaryMetric
            def allocation = row.secondaryMetrics?.'gc.alloc.rate.norm'
            [
                    scenario  : benchmarkName,
                    parser    : parserName,
                    parserName: parserLabels[parserName] ?: parserName,
                    mode      : row.mode,
                    modeName  : modeLabels[row.mode] ?: row.mode,
                    score     : toBigDecimalOrNull(primary.score),
                    error     : toBigDecimalOrNull(primary.scoreError),
                    allocation: toBigDecimalOrNull(allocation?.score)
            ]
        }

        def byScenarioMode = parsedRows.groupBy { "${it.scenario}|${it.mode}".toString() }
        byScenarioMode.each { key, groupRows ->
            def jackson = groupRows.find { it.parser == 'JACKSON' }
            groupRows.each { row ->
                if (jackson == null || jackson.score == 0G) {
                    row.multiplier = null
                } else if (row.mode == 'avgt') {
                    row.multiplier = jackson.score.divide(row.score, 10, java.math.RoundingMode.HALF_UP)
                } else {
                    row.multiplier = row.score.divide(jackson.score, 10, java.math.RoundingMode.HALF_UP)
                }
            }
        }

        def summaryRows = byScenarioMode['tickMessageDeserialize|thrpt'] ?: []
        def summaryByParser = summaryRows.collectEntries { row ->
            [(row.parser): row.multiplier]
        }
        def environment = [
                "JDK ${JavaVersion.current()}",
                System.getProperty('os.name'),
                System.getProperty('os.arch'),
                System.getenv('PROCESSOR_IDENTIFIER')
        ].findAll { it != null && it.toString().trim() }
                .join(', ')
        def summary = "요약: tickMessageDeserialize throughput 기준 Jackson 1.00x / Jsoniter ${formatMultiplier(summaryByParser['JSONITER'])} / DSL-JSON ${formatMultiplier(summaryByParser['DSL_JSON'])} (모드: throughput, ${environment})"
        def measurement = measurementSummary(rows.first())
        def weakMeasurement = isWeakMeasurement(rows.first())

        def scenarios = parsedRows*.scenario.unique().sort()
        def markdown = new StringBuilder()
        markdown << summary << System.lineSeparator()
        markdown << System.lineSeparator()
        markdown << "# JSON Parser Benchmark" << System.lineSeparator()
        markdown << System.lineSeparator()
        markdown << "- 결과 파일: `modules/benchmarks/build/reports/jmh/results.json`" << System.lineSeparator()
        markdown << "- GC 프로파일러: `gc.alloc.rate.norm` 기준 B/op" << System.lineSeparator()
        markdown << "- Jackson 대비 배수: throughput은 `parser / Jackson`, average time은 `Jackson / parser`" << System.lineSeparator()
        markdown << "- 측정 조건: ${measurement}" << System.lineSeparator()
        if (weakMeasurement) {
            markdown << System.lineSeparator()
            markdown << "> 주의: 이 결과는 quick/sanity 설정입니다. 표본 분산과 신뢰구간을 포트폴리오 근거로 쓰려면 기본 `:benchmarks:jmh` 설정으로 다시 실행하세요." << System.lineSeparator()
        }
        markdown << System.lineSeparator()

        scenarios.each { scenario ->
            markdown << "## ${scenario}" << System.lineSeparator()
            markdown << System.lineSeparator()
            markdown << "| Parser | Mode | Score (ops/us) | Error | Allocation (B/op) | Jackson 대비 배수 |" << System.lineSeparator()
            markdown << "| --- | --- | ---: | ---: | ---: | ---: |" << System.lineSeparator()

            parsedRows.findAll { it.scenario == scenario }
                    .sort { a, b -> a.mode <=> b.mode ?: a.parserName <=> b.parserName }
                    .each { row ->
                        markdown << "| ${row.parserName} | ${row.modeName} | ${formatDecimal(row.score)} | ${formatDecimal(row.error)} | ${formatDecimal(row.allocation)} | ${formatMultiplier(row.multiplier)} |" << System.lineSeparator()
                    }
            markdown << System.lineSeparator()
        }

        def outputFile = rootProject.layout.projectDirectory.file('docs/portfolio/json-parser-benchmark.md').asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(markdown.toString(), 'UTF-8')
    }
}

private static String formatDecimal(Object value) {
    if (value == null) {
        return 'n/a'
    }
    BigDecimal decimal = value as BigDecimal
    BigDecimal abs = decimal.abs()
    if (abs.compareTo(BigDecimal.ZERO) == 0) {
        return '0'
    }

    int scale = 3
    if (abs.compareTo(new BigDecimal('0.001')) < 0) {
        scale = 9
    } else if (abs.compareTo(BigDecimal.ONE) < 0) {
        scale = 6
    }

    return decimal.setScale(scale, java.math.RoundingMode.HALF_UP).stripTrailingZeros().toPlainString()
}

private static String formatMultiplier(Object value) {
    if (value == null) {
        return 'n/a'
    }
    BigDecimal decimal = value as BigDecimal
    return "${decimal.setScale(2, java.math.RoundingMode.HALF_UP).toPlainString()}x"
}

private static BigDecimal toBigDecimalOrNull(Object value) {
    if (value == null) {
        return null
    }
    String text = value.toString()
    if (text == 'NaN' || text == 'Infinity' || text == '-Infinity') {
        return null
    }
    return new BigDecimal(text)
}

private static String measurementSummary(Object row) {
    return "forks=${row.forks}, warmupIterations=${row.warmupIterations}, warmupTime=${row.warmupTime}, measurementIterations=${row.measurementIterations}, measurementTime=${row.measurementTime}"
}

private static boolean isWeakMeasurement(Object row) {
    return (row.forks as Integer) < 2
            || (row.warmupIterations as Integer) < 5
            || (row.measurementIterations as Integer) < 5
            || timeToMillis(row.warmupTime.toString()) < 1_000
            || timeToMillis(row.measurementTime.toString()) < 1_000
}

private static long timeToMillis(String text) {
    def parts = text.trim().split(/\s+/)
    if (parts.length < 2) {
        return 0L
    }
    BigDecimal value = new BigDecimal(parts[0])
    String unit = parts[1].toLowerCase()
    if (unit.startsWith('ms')) {
        return value.longValue()
    }
    if (unit.startsWith('s')) {
        return value.multiply(new BigDecimal('1000')).longValue()
    }
    if (unit.startsWith('m')) {
        return value.multiply(new BigDecimal('60000')).longValue()
    }
    return 0L
}
