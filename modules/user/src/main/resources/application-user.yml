app:
  env: ${APP_ENV:local}

ys:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL:300}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
      issuer: ${JWT_ISSUER:ys-coin}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coin_data?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:${DB_USER:postgres}}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
