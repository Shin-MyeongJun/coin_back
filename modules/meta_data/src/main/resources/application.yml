        ticker-24hr:            "${binance.future.usdt.base-url}/fapi/v1/ticker/24hr"
        price-ticker:           "${binance.future.usdt.base-url}/fapi/v1/ticker/price"
        book-ticker:            "${binance.future.usdt.base-url}/fapi/v1/ticker/bookTicker"
        premium-index:          "${binance.future.usdt.base-url}/fapi/v1/premiumIndex"
