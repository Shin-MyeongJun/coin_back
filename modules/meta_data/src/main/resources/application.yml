app:
  moduleName: meta-data
  heartbeat:
    enabled: true

spring:
    main:
        web-application-type: none
    session:
      store-type: none
    application:
        name: demo
    docker:
      compose:
        enabled: false
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_SERVERS:localhost:9092}}
      admin:
        properties:
          bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_SERVERS:localhost:9092}}
    cloud:
      stream:
        defaultBinder: null
    flyway:
      enabled: false
      locations: classpath:db/migration
      baseline-on-migrate: true

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/coin_data?reWriteBatchedInserts=true}
      username: ${DB_USER:db_manager}
      password: ${DB_PASSWORD}
      hikari:
        maximum-pool-size: 12
      #      driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
          ddl-auto: ${JPA_DDL_AUTO:update} # local default; use validate/none outside local

        show-sql: false
        properties:
          hibernate:
            jdbc:
              batch_size: 1000
            order_inserts: true
            format_sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect

    profiles:
        active: local
    task:
      scheduling:
        pool:
          size: 8

    autoconfigure:
      exclude: #에외 나중에 제거하기
       # - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration #kafka

        - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration #redis
        - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}
  datadog:
    metrics:
      export:
        enabled: false

upbit:
  # Base URLs
  base-url: "${UPBIT_BASE_URL:https://api.upbit.com}"
  websockets:
    public-url: "${UPBIT_PUBLIC_WS_URL:wss://api.upbit.com/websocket/v1}"
    private-url: "${UPBIT_PRIVATE_WS_URL:wss://api.upbit.com/websocket/v1/private}"

  access-key:     ${UPBIT_OPEN_API_ACCESS_KEY}
  secret-key:     ${UPBIT_OPEN_API_SECRET_KEY}

  # Quotation (시세) API Endpoints
  quotation:
    markets-all:  "${upbit.base-url}/v1/market/all"
    ticker:       "${upbit.base-url}/v1/ticker"
    orderbook:    "${upbit.base-url}/v1/orderbook"
    trades-ticks: "${upbit.base-url}/v1/trades/ticks"
    candles:
      minutes:   "${upbit.base-url}/v1/candles/minutes/{unit}"
      days:      "${upbit.base-url}/v1/candles/days"
      weeks:     "${upbit.base-url}/v1/candles/weeks"
      months:    "${upbit.base-url}/v1/candles/months"

  # Account (계좌) API
  accounts:
    list:        "${upbit.base-url}/v1/accounts"

  # Order (주문) API
  orders:
    create:      "${upbit.base-url}/v1/orders"
    cancel:      "${upbit.base-url}/v1/orders/{uuid}"
    list:        "${upbit.base-url}/v1/orders"
    chance:      "${upbit.base-url}/v1/orders/chance"

  # Withdrawal (출금) API
  withdraws:
    chance:      "${upbit.base-url}/v1/withdraws/chance"
    list:        "${upbit.base-url}/v1/withdraws"
    create:      "${upbit.base-url}/v1/withdraws"

  # Deposit (입금) API
  deposits:
    chance:      "${upbit.base-url}/v1/deposits/chance"
    list:        "${upbit.base-url}/v1/deposits"

bithumb:
  # Base URLs
  base-url: ${BITHUMB_BASE_URL:https://api.bithumb.com}
  websocket:
    public-url:  ${BITHUMB_PUBLIC_WS_URL:wss://ws-api.bithumb.com/websocket/v1}        # 공개 WebSocket 엔드포인트 :contentReference[oaicite:0]{index=0}
    private-url: ${BITHUMB_PRIVATE_WS_URL:wss://ws-api.bithumb.com/websocket/v1/private} # 인증 WebSocket 엔드포인트 :contentReference[oaicite:1]{index=1}

  # PUBLIC REST API
  public:
    market-all:    "${bithumb.base-url}/v1/market/all"                      # 마켓 코드 조회 :contentReference[oaicite:2]{index=2}
    ticker:        "${bithumb.base-url}/v1/ticker"                          # 현재가 정보 :contentReference[oaicite:3]{index=3}
    orderbook:     "${bithumb.base-url}/v1/orderbook"                       # 호가 정보 :contentReference[oaicite:4]{index=4}
    trades-ticks:  "${bithumb.base-url}/v1/trades/ticks"                    # 최근 체결 내역 :contentReference[oaicite:5]{index=5}
    candles:
      minutes:    "${bithumb.base-url}/v1/candles/minutes/{unit}"           # 분(Minute) 캔들 :contentReference[oaicite:6]{index=6}
      days:       "${bithumb.base-url}/v1/candles/days"                     # 일(Day) 캔들 :contentReference[oaicite:7]{index=7}
      weeks:      "${bithumb.base-url}/v1/candles/weeks"                    # 주(Week) 캔들 :contentReference[oaicite:8]{index=8}
      months:     "${bithumb.base-url}/v1/candles/months"                   # 월(Month) 캔들 :contentReference[oaicite:9]{index=9}

  # PRIVATE REST API (인증 필요)
  private:
    accounts:
      list:        "${bithumb.base-url}/v1/accounts"                        # 전체 계좌 조회 :contentReference[oaicite:10]{index=10}
    orders:
      chance:      "${bithumb.base-url}/v1/orders/chance"                  # 주문 가능 정보 :contentReference[oaicite:11]{index=11}
      get:         "${bithumb.base-url}/v1/order"                          # 개별 주문 조회 :contentReference[oaicite:12]{index=12}
      list:        "${bithumb.base-url}/v1/orders"                         # 주문 리스트 조회 :contentReference[oaicite:13]{index=13}
      create:      "${bithumb.base-url}/v2/orders"                         # 주문하기 (BETA) :contentReference[oaicite:14]{index=14}
      cancel:      "${bithumb.base-url}/v2/order"                          # 주문 취소 접수 (BETA) :contentReference[oaicite:15]{index=15}
    withdraws:
      list:        "${bithumb.base-url}/v1/withdraws"                      # 코인 출금 리스트 조회 :contentReference[oaicite:16]{index=16}
      krw:         "${bithumb.base-url}/v1/withdraws/krw"                  # 원화 출금 리스트 조회 :contentReference[oaicite:17]{index=17}
      get:         "${bithumb.base-url}/v1/withdraw"                       # 개별 출금 조회 :contentReference[oaicite:18]{index=18}
      chance:      "${bithumb.base-url}/v1/withdraws/chance"               # 출금 가능 정보 :contentReference[oaicite:19]{index=19}
    deposits:
      list:               "${bithumb.base-url}/v1/deposits"                # 코인 입금 리스트 조회 :contentReference[oaicite:20]{index=20}
      address-generate:   "${bithumb.base-url}/v1/deposits/generate_coin_address"  

binance:

  access-key: ${BINANCE_OPEN_API_ACCESS_KEY}
  secret-key: ${BINANCE_OPEN_API_SECRET_KEY}

  future:
