server:
  port: ${API_SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coindb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problem-details:
      enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  heartbeat:
    enabled: false
