server:
  port: ${API_SERVER_PORT:8080}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_SERVERS:localhost:9092}}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coindb}
    username: ${DB_USER:${DB_USERNAME:postgres}}
    password: ${DB_PASSWORD:${DB_PASS:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  autoconfigure:
    exclude:

ys:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL:300}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
      issuer: ${JWT_ISSUER:ys-coin}

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  moduleName: api
  heartbeat:
    enabled: true
  alert:
    evaluator:
      enabled: ${ALERT_EVALUATOR_ENABLED:false}
      refresh-interval-ms: ${ALERT_RULE_REFRESH_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}
  datadog:
    metrics:
      export:
        enabled: false
