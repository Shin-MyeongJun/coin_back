server:
  port: ${API_SERVER_PORT:8080}

spring:
  config:
    import:
      - "optional:file:${COIN_ENV_FILE:.env}[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
      - "optional:file:../../../.env[.properties]"
      - "optional:file:../../../../.env[.properties]"
  docker:
    compose:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problem-details:
      enabled: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  autoconfigure:
    exclude:

ys:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl-seconds: ${JWT_ACCESS_TTL:300}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
      issuer: ${JWT_ISSUER:ys-coin}

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  moduleName: api
  heartbeat:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}
  datadog:
    metrics:
      export:
        enabled: false
