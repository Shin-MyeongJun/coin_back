fred:
  api-key: ${FRED_API_KEY}
  base-url: https://api.stlouisfed.org/fred

  # 추적할 시리즈 목록
  tracked-series:
    - series-id: FEDFUNDS
      release-id: 17
      name: "Federal Funds Rate"
      frequency: MONTHLY
      impact: HIGH

    - series-id: CPIAUCSL
      release-id: 10
      name: "Consumer Price Index"
      frequency: MONTHLY
      impact: HIGH

    - series-id: UNRATE
      release-id: 50
      name: "Unemployment Rate"
      frequency: MONTHLY
      impact: HIGH

    - series-id: PAYEMS
      release-id: 50
      name: "Nonfarm Payrolls"
      frequency: MONTHLY
      impact: CRITICAL

    - series-id: GDP
      release-id: 53
      name: "Gross Domestic Product"
      frequency: QUARTERLY
      impact: HIGH

    - series-id: T10Y2Y
      release-id: 431
      name: "10Y-2Y Treasury Spread"
      frequency: DAILY
      impact: MEDIUM

    - series-id: DEXKOUS
      release-id: 17
      name: "USD/KRW Exchange Rate"
      frequency: DAILY
      impact: HIGH

    - series-id: DGS10
      release-id: 18
      name: "10-Year Treasury Rate"
      frequency: DAILY
      impact: MEDIUM

  schedule:
    release-sync-cron: "0 0 6 * * *"     # 매일 06:00 발표일정 동기화
    observation-check-ms: 1800000          # 30분마다 발표 체크