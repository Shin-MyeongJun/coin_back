
syntax = "proto3";
package contracts;

option java_package = "com.example.demo.contracts";
option java_multiple_files = true;

message TickRawMessage{
  string tradingPair =1;
  string exchange_name =2;
  string exchange_type  =3;
  string quote =4;
  string base =5;
  string bid  =6;
  string ask  =7;
  int64 timestamp  =8;
}