plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.projectreactor.netty:reactor-netty'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation(project(":contracts"))
    implementation(project(":infra_shard"))
    implementation(project(":economic_ind_shard"))

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// NOTE: FredIndMapper and FredScheduleMapper have incomplete implementations (syntax errors).
// Excluded to allow compilation. See COIN-BUG-003.
compileJava {
    exclude 'com/example/demo/ingestion/economic/economic_ind/infrastructure/parer/**'
}

tasks.named('test') {
    useJUnitPlatform()
}