app:
  moduleName: ingestion
  heartbeat:
    enabled: true
    sub-type: crawling

spring:
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coindb}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

kafka:
  bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

crawling-eco:
  burst:
    interval-ms: 30000       # 30s between burst poll attempts
    timeout-ms: 7200000      # 2 hours before giving up

  indicators:
    - type: CPI
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "CPI"
      yahoo-event-name: "Consumer Price Index"

    - type: FFR
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Fed Interest Rate Decision"
      yahoo-event-name: "Federal Funds Rate"

    - type: UNRATE
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Unemployment Rate"
      yahoo-event-name: "Unemployment Rate"

    - type: NFP
      country: US
      frequency: MONTHLY
      unit: COUNT
      investing-event-name: "Non-Farm Employment Change"
      yahoo-event-name: "Nonfarm Payrolls"

    - type: PPI
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "PPI m/m"
      yahoo-event-name: "Producer Price Index"

    - type: BR
      country: JP
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "BoJ Interest Rate Decision"
      yahoo-event-name: "Japan Interest Rate"

    - type: ICSA
      country: US
      frequency: WEEKLY
      unit: COUNT
      investing-event-name: "Initial Jobless Claims"
      yahoo-event-name: "Initial Claims"

    - type: RETAIL_SALES
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Retail Sales m/m"
      yahoo-event-name: "Retail Sales"

    - type: UMCSENT
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "Michigan Consumer Sentiment"
      yahoo-event-name: "Michigan Consumer Sentiment"

    - type: CORE_PCE
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Core PCE Price Index"
      yahoo-event-name: "Core PCE Price Index"
