app:
  moduleName: ingestion
  heartbeat:
    enabled: true
    sub-type: crawling

spring:
  config:
    import:
      - "optional:file:${COIN_ENV_FILE:.env}[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
      - "optional:file:../../../.env[.properties]"
      - "optional:file:../../../../.env[.properties]"
  main:
    web-application-type: none
  docker:
    compose:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

crawling-eco:
  burst:
    interval-ms: 30000       # 30s between burst poll attempts
    timeout-ms: 7200000      # 2 hours before giving up

  indicators:
    - type: CPI
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "CPI"
      yahoo-event-name: "Consumer Price Index"

    - type: FFR
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Fed Interest Rate Decision"
      yahoo-event-name: "Federal Funds Rate"

    - type: UNRATE
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Unemployment Rate"
      yahoo-event-name: "Unemployment Rate"

    - type: NFP
      country: US
      frequency: MONTHLY
      unit: COUNT
      investing-event-name: "Non-Farm Employment Change"
      yahoo-event-name: "Nonfarm Payrolls"

    - type: PPI
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "PPI m/m"
      yahoo-event-name: "Producer Price Index"

    - type: BR
      country: JP
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "BoJ Interest Rate Decision"
      yahoo-event-name: "Japan Interest Rate"

    - type: ICSA
      country: US
      frequency: WEEKLY
      unit: COUNT
      investing-event-name: "Initial Jobless Claims"
      yahoo-event-name: "Initial Claims"

    - type: RETAIL_SALES
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Retail Sales m/m"
      yahoo-event-name: "Retail Sales"

    - type: UMCSENT
      country: US
      frequency: MONTHLY
      unit: INDEX
      investing-event-name: "Michigan Consumer Sentiment"
      yahoo-event-name: "Michigan Consumer Sentiment"

    - type: CORE_PCE
      country: US
      frequency: MONTHLY
      unit: PERCENT
      investing-event-name: "Core PCE Price Index"
      yahoo-event-name: "Core PCE Price Index"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}
